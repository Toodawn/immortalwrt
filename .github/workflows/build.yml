name: Build ImmortalWrt AX6000 U-BootMod


on:

  workflow_dispatch:

  schedule:

    - cron: "0 2 * * 0"



permissions:

  contents: write



env:

  TZ: Asia/Shanghai



jobs:


  build:


    runs-on: ubuntu-22.04



    steps:



    # =========================
    # Checkout
    # =========================

    - name: Checkout

      uses: actions/checkout@v4



    # =========================
    # 清理空间
    # =========================

    - name: Free disk space

      run: |

        sudo rm -rf /usr/local/lib/android

        sudo rm -rf /usr/share/dotnet

        sudo rm -rf /opt/ghc

        sudo apt clean



    # =========================
    # 缓存
    # =========================

    - name: Cache ImmortalWrt


      uses: actions/cache@v4


      with:


        path: |

          dl

          build_dir

          staging_dir

          toolchain

          tmp

          .config

          package/OpenClash

          package/daed

          package/luci-app-lucky



        key: immortalwrt-ax6000-${{ hashFiles('ax6000.config','feeds.conf.default') }}



        restore-keys: |

          immortalwrt-ax6000-



    # =========================
    # 依赖
    # =========================

    - name: Install dependencies

      run: |

        sudo apt update


        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          rsync \
          unzip \
          zlib1g-dev \
          file





    # =========================
    # feeds
    # =========================

    - name: Update feeds


      run: |


        if [ ! -d feeds/luci ]; then


          ./scripts/feeds update -a


          ./scripts/feeds install -a


        else


          echo "feeds cache exists"


        fi





    # =========================
    # OpenClash
    # =========================

    - name: Add OpenClash


      run: |


        if [ ! -d package/OpenClash ]; then


          git clone --depth=1 \

          https://github.com/vernesong/OpenClash.git \

          package/OpenClash


        fi





    # =========================
    # Daed
    # =========================

    - name: Add Daed


      run: |


        if [ ! -d package/daed ]; then


          git clone --depth=1 \

          https://github.com/daeuniverse/daed.git \

          package/daed


        fi





    # =========================
    # Lucky
    # =========================

    - name: Add Lucky


      run: |


        if [ ! -d package/luci-app-lucky ]; then


          git clone --depth=1 \

          https://github.com/gdy666/luci-app-lucky.git \

          package/luci-app-lucky


        fi





    # =========================
    # 首次启动脚本权限
    # =========================

    - name: Set custom scripts permission


      run: |


        chmod +x files/etc/uci-defaults/* || true





    # =========================
    # 加载配置
    # =========================

    - name: Load AX6000 config


      run: |


        cp ax6000.config .config


        make defconfig





    # =========================
    # 下载
    # =========================

    - name: Download packages


      run: |


        make download -j8





    # =========================
    # 编译
    # =========================

    - name: Compile firmware


      run: |


        make -j8





    # =========================
    # 固件整理
    # =========================

    - name: Prepare firmware


      run: |


        mkdir -p release



        echo "=== Firmware list ==="



        find bin/targets -type f | grep -E "itb|img"



        echo "=== Copy sysupgrade ==="



        cp $(find bin/targets -name "*sysupgrade.itb") release/



        cp $(find bin/targets -name "sha256sums") release/





    # =========================
    # Artifact
    # =========================

    - name: Upload Artifact


      uses: actions/upload-artifact@v4


      with:


        name: AX6000-UbootMod-sysupgrade


        path: release/*





    # =========================
    # Release
    # =========================

    - name: Create Release


      uses: softprops/action-gh-release@v2


      with:


        tag_name: AX6000-${{ github.run_number }}


        name: ImmortalWrt AX6000 U-BootMod Build ${{ github.run_number }}


        files: |

          release/*



      env:


        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
