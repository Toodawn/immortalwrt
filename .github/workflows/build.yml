name: Build ImmortalWrt AX6000 U-BootMod


on:

  workflow_dispatch:

  schedule:

    - cron: "0 2 * * 0"



permissions:

  contents: write



env:

  TZ: Asia/Shanghai

  USE_CCACHE: 1

  CCACHE_DIR: ~/.ccache



jobs:


  build:


    runs-on: ubuntu-22.04



    steps:



    # =========================
    # Checkout
    # =========================

    - name: Checkout

      uses: actions/checkout@v5





    # =========================
    # Free disk
    # =========================

    - name: Free disk space

      run: |

        sudo rm -rf /usr/local/lib/android

        sudo rm -rf /usr/share/dotnet

        sudo rm -rf /opt/ghc

        sudo apt clean





    # =========================
    # Cache
    # =========================

    - name: Cache ImmortalWrt


      uses: actions/cache@v5


      with:


        path: |

          dl

          build_dir

          staging_dir

          toolchain

          tmp

          feeds

          package/feeds

          package/OpenClash

          package/daed

          package/luci-app-lucky

          ~/.ccache



        key:

          immortalwrt-ax6000-${{ github.ref_name }}-${{ hashFiles('ax6000.config','feeds.conf.default') }}



        restore-keys: |

          immortalwrt-ax6000-





    # =========================
    # Dependencies
    # =========================

    - name: Install dependencies


      run: |


        sudo apt update


        sudo apt install -y \
          build-essential \
          ccache \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          rsync \
          unzip \
          zlib1g-dev \
          file





    # =========================
    # Setup ccache
    # =========================

    - name: Setup ccache


      run: |


        ccache --max-size=5G


        ccache -s





    # =========================
    # Update feeds
    # =========================

    - name: Update feeds


      run: |


        ./scripts/feeds update -a


        ./scripts/feeds install -a
        # =========================
    # Add OpenClash
    # =========================

    - name: Add OpenClash


      run: |


        rm -rf package/OpenClash


        git clone --depth=1 \
        https://github.com/vernesong/OpenClash.git \
        package/OpenClash





    # =========================
    # Add Daed
    # =========================

    - name: Add Daed


      run: |


        rm -rf package/daed


        git clone --depth=1 \
        https://github.com/daeuniverse/daed.git \
        package/daed





    # =========================
    # Add Lucky
    # =========================

    - name: Add Lucky


      run: |


        rm -rf package/luci-app-lucky


        git clone --depth=1 \
        https://github.com/gdy666/luci-app-lucky.git \
        package/luci-app-lucky





    # =========================
    # Set uci-default permission
    # =========================

    - name: Set custom scripts permission


      run: |


        chmod +x files/etc/uci-defaults/* || true





    # =========================
    # Load AX6000 config
    # =========================

    - name: Load AX6000 config


      run: |


        cp ax6000.config .config


        make defconfig





    # =========================
    # Download packages
    # =========================

    - name: Download packages


      run: |


        make download -j$(nproc)





    # =========================
    # Compile firmware
    # =========================

    - name: Compile firmware


      run: |


        echo "===== Compile Start ====="


        make -j$(nproc) V=s


        echo "===== Compile Done ====="





    # =========================
    # Show firmware
    # =========================

    - name: Check firmware


      run: |


        echo "===== Firmware List ====="


        find bin/targets -type f





    # =========================
    # Prepare firmware
    # =========================

    - name: Prepare firmware

      run: |

        mkdir -p release


        TARGET=bin/targets/mediatek/filogic



        VERSION=$(grep DISTRIB_RELEASE package/base-files/files/etc/openwrt_release | cut -d '"' -f2)



        DATE=$(date +"%Y%m%d-%H%M")



        echo "Copy firmware files..."



        cp $TARGET/*ubootmod-bl31-uboot.fip release/ || true


        cp $TARGET/*ubootmod-preloader.bin release/ || true


        cp $TARGET/*ubootmod-initramfs-factory.ubi release/ || true


        cp $TARGET/*ubootmod-initramfs-recovery.itb release/ || true





        SYSUPGRADE=$(find $TARGET -name "*ubootmod*squashfs-sysupgrade.itb" | head -n 1)



        if [ -z "$SYSUPGRADE" ]; then

          echo "ERROR: sysupgrade.itb not found"

          exit 1

        fi





        cp "$SYSUPGRADE" \
        release/AX6000-UbootMod-ImmortalWrt-${VERSION}-${DATE}.itb





        echo "Generate SHA256..."



        cd release


        sha256sum * > sha256sums


        cd ..



        echo "===== Release Files ====="


        ls -lh release/



    # =========================
    # Upload Artifact
    # =========================

    - name: Upload Artifact


      uses: actions/upload-artifact@v5


      with:


        name: AX6000-UbootMod-${{ github.run_number }}


        path: release/*





    # =========================
    # Create Release
    # =========================

    - name: Create Release


      uses: softprops/action-gh-release@v3


      with:


        tag_name: AX6000-${{ github.run_number }}


        name: >

          ImmortalWrt AX6000 U-BootMod

          Build ${{ github.run_number }}



        body: |

          ## ImmortalWrt AX6000 U-BootMod


          Build Number:

          ${{ github.run_number }}


          Build Time:

          ${{ env.TZ }}


          Firmware:

          - bl31-uboot.fip

          - preloader.bin

          - initramfs-factory.ubi

          - initramfs-recovery.itb

          - squashfs-sysupgrade.itb



        files: |

          release/*



      env:


        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
