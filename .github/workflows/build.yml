name: Build ImmortalWrt AX6000 U-BootMod


on:

  workflow_dispatch:

  schedule:

    - cron: "0 2 * * 0"



permissions:

  contents: write



env:

  TZ: Asia/Shanghai

  USE_CCACHE: 1

  CCACHE_DIR: ~/.ccache





jobs:


  build:


    runs-on: ubuntu-22.04



    steps:



    # =========================
    # Checkout
    # =========================

    - name: Checkout

      uses: actions/checkout@v5





    # =========================
    # 清理空间
    # =========================

    - name: Free disk space

      run: |

        sudo rm -rf /usr/local/lib/android

        sudo rm -rf /usr/share/dotnet

        sudo rm -rf /opt/ghc

        sudo apt clean





    # =========================
    # Cache
    # =========================

    - name: Cache ImmortalWrt


      uses: actions/cache@v5


      with:


        path: |

          dl

          build_dir

          staging_dir

          toolchain

          tmp

          feeds

          package/feeds

          ~/.ccache

          package/OpenClash

          package/daed

          package/luci-app-lucky



        key:

          immortalwrt-ax6000-${{ hashFiles('ax6000.config','feeds.conf.default') }}



        restore-keys:

          immortalwrt-ax6000-





    # =========================
    # 安装依赖
    # =========================

    - name: Install dependencies


      run: |


        sudo apt update


        sudo apt install -y \

          build-essential \

          ccache \

          clang \

          flex \

          bison \

          g++ \

          gawk \

          gettext \

          git \

          libncurses-dev \

          libssl-dev \

          python3 \

          rsync \

          unzip \

          zlib1g-dev \

          file





    # =========================
    # ccache
    # =========================

    - name: Setup ccache


      run: |


        ccache --max-size=5G

        ccache -z





    # =========================
    # feeds 最新更新
    # =========================

    - name: Update feeds


      run: |


        ./scripts/feeds update -a


        ./scripts/feeds install -a





    # =========================
    # OpenClash 最新版
    # =========================

    - name: Add OpenClash


      run: |


        if [ ! -d package/OpenClash ]; then


          git clone --depth=1 \

          https://github.com/vernesong/OpenClash.git \

          package/OpenClash


        else


          cd package/OpenClash

          git pull


        fi





    # =========================
    # Daed 最新版
    # =========================

    - name: Add Daed


      run: |


        if [ ! -d package/daed ]; then


          git clone --depth=1 \

          https://github.com/daeuniverse/daed.git \

          package/daed


        else


          cd package/daed

          git pull


        fi





    # =========================
    # Lucky 最新版
    # =========================

    - name: Add Lucky


      run: |


        if [ ! -d package/luci-app-lucky ]; then


          git clone --depth=1 \

          https://github.com/gdy666/luci-app-lucky.git \

          package/luci-app-lucky


        else


          cd package/luci-app-lucky

          git pull


        fi





    # =========================
    # 自定义脚本权限
    # =========================

    - name: Set scripts permission


      run: |


        chmod +x files/etc/uci-defaults/* || true





    # =========================
    # AX6000配置
    # =========================

    - name: Load AX6000 config


      run: |


        cp ax6000.config .config


        make defconfig





    # =========================
    # 下载
    # =========================

    - name: Download packages


      run: |


        make download -j16





    # =========================
    # 编译
    # =========================

    - name: Compile firmware


      run: |


        make -j$(nproc) V=s





    # =========================
    # 检查输出
    # =========================

    - name: Check firmware


      run: |


        find bin/targets/mediatek/filogic -type f





    # =========================
    # 打包全部文件
    # =========================

    - name: Prepare firmware


      run: |


        mkdir -p release


        TARGET=bin/targets/mediatek/filogic



        cp -r $TARGET/* release/



        cp .config release/config.buildinfo



        git rev-parse HEAD > release/source_commit.txt


        git log -1 > release/source_log.txt





        tar -czf release/immortalwrt-ax6000-source.tar.gz \

        --exclude=build_dir \

        --exclude=staging_dir \

        --exclude=dl \

        --exclude=tmp \

        .



        ls -lh release/





    # =========================
    # Artifact
    # =========================

    - name: Upload Artifact


      uses: actions/upload-artifact@v5


      with:


        name: AX6000-UbootMod-Full


        path: release/*





    # =========================
    # Release
    # =========================

    - name: Create Release


      uses: softprops/action-gh-release@v3


      with:


        tag_name: AX6000-${{ github.run_number }}


        name:

          ImmortalWrt AX6000 U-BootMod Full Build ${{ github.run_number }}


        files: |

          release/*



      env:


        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
